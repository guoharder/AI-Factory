<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    .row { margin: 0.75rem 0; }
    label { display: inline-block; width: 6rem; }
    input[type="number"] { padding: 0.4rem; width: 10rem; }
    .ops button {
      padding: 0.5rem 0.9rem;
      margin-right: 0.4rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1rem;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-height: 1.4rem;
      font-size: 1.1rem;
    }
    #result.error { color: #b00020; border-color: #b00020; }
    #history { margin-top: 1.5rem; }
    #history h2 { font-size: 1rem; margin-bottom: 0.5rem; }
    #history-list {
      list-style: none;
      padding: 0;
      margin: 0 0 0.75rem 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #history-list li {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid #eee;
      font-size: 0.95rem;
    }
    #history-list li:last-child { border-bottom: none; }
    #history-list li.history-empty { color: #888; }
    #clear-history {
      padding: 0.5rem 0.9rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Web Calculator</h1>

  <div class="row">
    <label for="a">Operand A</label>
    <input type="number" id="a" step="any" value="0" />
  </div>
  <div class="row">
    <label for="b">Operand B</label>
    <input type="number" id="b" step="any" value="0" />
  </div>

  <div class="row ops">
    <button type="button" data-op="add">Add (+)</button>
    <button type="button" data-op="sub">Subtract (−)</button>
    <button type="button" data-op="mul">Multiply (×)</button>
    <button type="button" data-op="div">Divide (÷)</button>
  </div>

  <div id="result" aria-live="polite">Result will appear here.</div>

  <section id="history">
    <h2>History</h2>
    <ul id="history-list"></ul>
    <button type="button" id="clear-history">Clear history</button>
  </section>

  <!-- Single source of truth: reuse src/math.js (no arithmetic reimplemented here) -->
  <script src="/src/math.js"></script>
  <script>
    (function () {
      var HISTORY_LIMIT = 20;
      var history = [];

      var resultEl = document.getElementById("result");

      function showResult(text) {
        resultEl.textContent = text;
        resultEl.classList.remove("error");
      }
      function showError(text) {
        resultEl.textContent = text;
        resultEl.classList.add("error");
      }

      function renderHistory() {
        var listEl = document.getElementById("history-list");
        listEl.textContent = "";
        if (history.length === 0) {
          var empty = document.createElement("li");
          empty.className = "history-empty";
          empty.textContent = "No history yet.";
          listEl.appendChild(empty);
          return;
        }
        for (var i = 0; i < history.length; i++) {
          var li = document.createElement("li");
          li.textContent = history[i].expr;
          listEl.appendChild(li);
        }
      }

      function pushHistory(expr, value) {
        history.push({ expr: expr, value: value });
        history = history.slice(-HISTORY_LIMIT);
        try {
          localStorage.setItem("calc_history", JSON.stringify(history));
        } catch (e) {
          // localStorage unavailable (private mode, quota exceeded) — degrade silently
        }
        renderHistory();
      }

      function loadHistory() {
        try {
          var raw = localStorage.getItem("calc_history");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              history = parsed.filter(function (e) { return e && typeof e.expr === 'string'; });
            }
          }
        } catch (e) {
          // Malformed storage — start fresh
          history = [];
        }
        renderHistory();
      }

      function compute(op) {
        var aRaw = document.getElementById("a").value;
        var bRaw = document.getElementById("b").value;
        var a = Number(aRaw);
        var b = Number(bRaw);

        if (aRaw.trim() === "" || bRaw.trim() === "" || Number.isNaN(a) || Number.isNaN(b)) {
          showError("Please enter two valid numbers.");
          return;
        }

        var opSymbols = { add: "+", sub: "−", mul: "×", div: "÷" };

        try {
          var value = window.mathLib[op](a, b);
          showResult("Result: " + value);
          pushHistory(a + " " + opSymbols[op] + " " + b + " = " + value, value);
        } catch (err) {
          showError("Error: " + err.message);
        }
      }

      var buttons = document.querySelectorAll(".ops button");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", function () {
          compute(this.getAttribute("data-op"));
        });
      }

      document.getElementById("clear-history").addEventListener("click", function () {
        history = [];
        try {
          localStorage.removeItem("calc_history");
        } catch (e) {
          // localStorage unavailable — nothing to remove
        }
        renderHistory();
      });

      loadHistory();
    })();
  </script>
</body>
</html>
